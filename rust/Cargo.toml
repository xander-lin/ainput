[package]
name = "ainput_core"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[features]
default = []
diagnostics = []

[dependencies]
libc = "0.2"
libpulse-binding = "2"
curl = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
