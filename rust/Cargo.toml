[package]
name = "ainput_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[features]
default = []
diagnostics = []

[dependencies]
libc = "0.2"
libpulse-binding = "2"
# Link the system libcurl instead of the `ssl` feature: the latter pulls in
# openssl-sys, which needs a target OpenSSL to build. The addon links libcurl
# dynamically anyway (meta.json / PKGBUILD depend on it), so its TLS stack is
# whatever the system curl uses.
curl = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true

# Per-stage timing for one dictation, no network. Run with:
#   cargo run --release --example pipeline
[[example]]
name = "pipeline"
path = "examples/pipeline.rs"
