# meson cross file for aarch64. pkg-config resolves the target libraries through
# the PKG_CONFIG_* variables that tools/cross-aarch64.sh exports; no wrapper
# script is needed because the *-sys crates read the same variables.
[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkgconfig = 'pkg-config'

[built-in options]
cpp_std = 'c++20'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
